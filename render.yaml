# Render Blueprint — Campus Found backend
#
# Deploy: Render Dashboard → New → Blueprint → pick this repo (root directory: backend).
# Values marked `sync: false` are entered in the Render dashboard on first deploy —
# no secrets live in this file.
#
#   MONGODB_URI → MongoDB Atlas connection string:
#                 mongodb+srv://<user>:<password>@<cluster>.mongodb.net/campus_found?retryWrites=true&w=majority
#   JWT_SECRET  → long random string (e.g. `openssl rand -hex 32`)
#
# After deploy, set the frontend env var VITE_API_URL to the URL Render gives you
# (https://campus-found-api-xxxx.onrender.com) and redeploy the frontend.

services:
  - type: web
    name: campus-found-api
    runtime: node
    plan: free
    rootDir: backend        # remove if this file sits in the repo root
    region: singapore       # closest to BD campus users; change if you like
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      - key: MONGODB_URI
        sync: false         # fill in dashboard: your Atlas connection string
      - key: JWT_SECRET
        sync: false         # fill in dashboard: long random string
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CLIENT_ORIGIN
        sync: false         # fill in dashboard: your frontend URL, e.g. https://campus-found.vercel.app
      - key: MAX_UPLOAD_MB
        value: "5"
